name: nutriplato
description: Aprende a crear tu plato del Bien Comer y cuidarte en el dia a dia.
publish_to: 'none'
version: 3.0.0+4

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  android_intent_plus: ^6.1.0
  circular_countdown_timer: ^0.2.3
  flutter:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  get: ^4.6.6
  google_fonts: ^8.2.1
  http: ^1.2.1
  icons_plus: ^5.0.0
  intl: ^0.20.3
  introduction_screen: ^4.0.0
  percent_indicator: ^4.2.4
  provider: ^6.0.5
  salomon_bottom_bar: ^3.3.2
  shared_preferences: ^2.1.1
  showcaseview: ^5.1.0
  share_plus: ^13.3.0
  shimmer: ^3.0.0
  lottie: ^3.5.1
  smooth_page_indicator: ^2.0.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "lib/data/img/logo_nutriplato.png"

flutter:
  uses-material-design: true
  assets:
    - lib/data/img/
    - lib/data/img/porciones_mano/
    - lib/data/img/animal/
    - lib/data/img/cereales/
    - lib/data/img/fruits/
    - lib/data/img/leguminosas/
    - lib/data/img/vegetables/
